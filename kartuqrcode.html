<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Pelajar QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; padding: 0 !important; margin: 0 !important; }
      .card-grid { gap: 0.4cm !important; }
      @page { size: A4 portrait; margin: 1cm; }
    }
    .id-card { width: 85.6mm; height: 53.98mm; border-radius: 8px; overflow: hidden; position: relative; box-sizing: border-box; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-6 text-gray-800">

  <!-- PANEL PENGATURAN KARTU (NO PRINT) -->
  <div class="max-w-5xl mx-auto bg-white p-4 rounded-2xl shadow-md mb-6 no-print space-y-4 border border-gray-200">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 pb-3">
      <div>
        <h1 class="font-bold text-lg text-blue-900">Cetak Kartu Pelajar QR Code</h1>
        <p class="text-xs text-gray-500">Pilih kelas, sesuaikan warna & logo kartu lalu cetak</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Cetak Kartu (A4)
        </button>
        <button onclick="window.close()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-xs font-bold">
          Tutup
        </button>
      </div>
    </div>

    <!-- FILTER & DESAIN -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
      <div>
        <label class="block font-bold text-gray-700 mb-1">Filter Kelas</label>
        <select id="filter-kelas-kartu" onchange="renderKartuSiswa()" class="w-full p-2 bg-slate-50 border border-gray-200 rounded-xl font-bold text-gray-800">
          <option value="ALL">Semua Kelas</option>
        </select>
      </div>

      <div>
        <label class="block font-bold text-gray-700 mb-1">Tema Warna Kartu</label>
        <select id="theme-color-select" onchange="updateCardTheme()" class="w-full p-2 bg-slate-50 border border-gray-200 rounded-xl font-bold text-gray-800">
          <option value="blue">Biru Elegan</option>
          <option value="emerald">Hijau Islami</option>
          <option value="red">Merah Bertenaga</option>
          <option value="purple">Ungu Modern</option>
          <option value="dark">Hitam Premium</option>
        </select>
      </div>

      <!-- UNGGAH LOGO KIRI -->
      <div>
        <label class="block font-bold text-gray-700 mb-1">Logo Kiri (Sekolah)</label>
        <input type="file" id="input-logo-kiri" accept="image/*" onchange="uploadLogoKartu(event, 'LOGO_KARTU_KIRI')" class="w-full text-[10px]">
      </div>

      <!-- UNGGAH LOGO KANAN -->
      <div>
        <label class="block font-bold text-gray-700 mb-1">Logo Kanan (Pemda/Tut Wuri)</label>
        <input type="file" id="input-logo-kanan" accept="image/*" onchange="uploadLogoKartu(event, 'LOGO_KARTU_KANAN')" class="w-full text-[10px]">
      </div>
    </div>
    <span id="kartu-upload-status" class="text-[10px] text-emerald-600 font-bold block"></span>
  </div>

  <!-- CONTAINER GRID KARTU (PAGINASI A4) -->
  <div class="max-w-5xl mx-auto flex flex-col items-center">
    <div id="kartu-container" class="card-grid grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="text-xs text-gray-400 py-10">Memuat data kartu siswa...</div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0wSQS50V0qen_O29TXSE1ngwEao4SMpJyQuUlUISLz5uxvmqqkqQnsAmmoRL0M8Cmqw/exec";
    let allStudentsData = [];
    let logoKiriUrl = "", logoKananUrl = "";

    const THEME_STYLES = {
      blue: { bgHeader: "bg-blue-900", textHeader: "text-white", border: "border-blue-900" },
      emerald: { bgHeader: "bg-emerald-800", textHeader: "text-white", border: "border-emerald-800" },
      red: { bgHeader: "bg-rose-900", textHeader: "text-white", border: "border-rose-900" },
      purple: { bgHeader: "bg-purple-900", textHeader: "text-white", border: "border-purple-900" },
      dark: { bgHeader: "bg-gray-900", textHeader: "text-white", border: "border-gray-900" }
    };

    async function loadKartuData() {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=GET_KARTU_QR_DATA`);
        const data = await res.json();

        if (data.success) {
          allStudentsData = data.students || [];
          const st = data.settings || {};

          logoKiriUrl = st.LOGO_KARTU_KIRI || localStorage.getItem("LOGO_KARTU_KIRI") || "";
          logoKananUrl = st.LOGO_KARTU_KANAN || localStorage.getItem("LOGO_KARTU_KANAN") || "";

          // Populate Kelas
          const classes = [...new Set(allStudentsData.map(s => s.kelas))].filter(Boolean).sort();
          document.getElementById("filter-kelas-kartu").innerHTML = '<option value="ALL">Semua Kelas</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

          renderKartuSiswa();
        }
      } catch (e) {
        alert("Gagal memuat data dari server.");
      }
    }

    function renderKartuSiswa() {
      const selectedClass = document.getElementById("filter-kelas-kartu").value;
      const themeKey = document.getElementById("theme-color-select").value;
      const theme = THEME_STYLES[themeKey] || THEME_STYLES.blue;

      const filtered = allStudentsData.filter(s => (selectedClass === "ALL" || s.kelas === selectedClass) && (s.active === undefined || s.active === true));
      const container = document.getElementById("kartu-container");

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-xs text-gray-400 py-10">Tidak ada siswa terdaftar.</div>`;
        return;
      }

      container.innerHTML = filtered.map((s, idx) => `
        <div class="id-card bg-white border-2 ${theme.border} shadow-md flex flex-col justify-between">
          <!-- HEADER KARTU -->
          <div class="${theme.bgHeader} ${theme.textHeader} p-1.5 flex items-center justify-between">
            <div class="w-6 h-6 flex items-center justify-center">
              ${logoKiriUrl ? `<img src="${logoKiriUrl}" class="max-w-full max-h-full object-contain" onerror="this.remove()">` : ''}
            </div>
            <div class="text-center flex-1 px-1">
              <h4 class="text-[8px] font-black uppercase tracking-tighter leading-none">KARTU PELAJAR SISWA</h4>
              <h5 class="text-[7px] font-bold opacity-80 leading-tight">SMK NEGERI 1 WAKATOBI</h5>
            </div>
            <div class="w-6 h-6 flex items-center justify-center">
              ${logoKananUrl ? `<img src="${logoKananUrl}" class="max-w-full max-h-full object-contain" onerror="this.remove()">` : ''}
            </div>
          </div>

          <!-- BODY KARTU -->
          <div class="p-2 flex-1 flex items-center justify-between gap-2">
            <div class="space-y-0.5 text-[9px] min-w-0 flex-1">
              <p class="font-black text-[10px] text-gray-900 truncate">${s.nama}</p>
              <p class="text-gray-600">NISN: <b class="text-gray-800">${s.nisn || '-'}</b></p>
              <p class="text-gray-600">Kelas: <b class="text-gray-800">${s.kelas}</b></p>
              <p class="text-gray-600 truncate">TTL: <b class="text-gray-800">${s.ttl || '-'}</b></p>
            </div>
            
            <!-- QR CODE BOX -->
            <div class="w-16 h-16 bg-white p-1 border border-gray-300 rounded flex items-center justify-center">
              <div id="qrcode-${idx}"></div>
            </div>
          </div>

          <!-- FOOTER KARTU -->
          <div class="bg-gray-100 px-2 py-0.5 text-[7px] text-gray-500 font-bold flex justify-between border-t border-gray-200">
            <span>ID: ${s.id_siswa}</span>
            <span>Berlaku Selama Menjadi Siswa</span>
          </div>
        </div>
      `).join('');

      // Generate QR Code untuk setiap siswa
      filtered.forEach((s, idx) => {
        new QRCode(document.getElementById(`qrcode-${idx}`), {
          text: s.qr_key || s.id_siswa,
          width: 58,
          height: 58,
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    function updateCardTheme() { renderKartuSiswa(); }

    function uploadLogoKartu(event, settingsKey) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById("kartu-upload-status");
      statusEl.innerText = "Mengunggah & Menyimpan Logo...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        if (settingsKey === 'LOGO_KARTU_KIRI') logoKiriUrl = base64Data;
        if (settingsKey === 'LOGO_KARTU_KANAN') logoKananUrl = base64Data;

        renderKartuSiswa();

        const payload = {};
        payload[settingsKey] = base64Data;

        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "SAVE_KARTU_QR_SETTINGS", data: payload })
        })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            statusEl.innerText = "Logo Berhasil Disimpan Permanen!";
            loadKartuData();
          } else {
            statusEl.innerText = "Gagal menyimpan logo ke Drive.";
          }
        })
        .catch(() => {
          statusEl.innerText = "Tersimpan Lokal (Offline).";
        });
      };
      reader.readAsDataURL(file);
    }

    window.onload = () => { loadKartuData(); };
  </script>
</body>
</html>
